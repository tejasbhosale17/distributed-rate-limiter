services:
  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  app1:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: '3000'
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_URL: redis://redis:6379
      REDIS_FAILURE_MODE: ${REDIS_FAILURE_MODE:-closed}
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-500}
      REDIS_COMMAND_TIMEOUT_MS: ${REDIS_COMMAND_TIMEOUT_MS:-250}
      REDIS_STARTUP_TIMEOUT_MS: ${REDIS_STARTUP_TIMEOUT_MS:-3000}
      APP_ENV: ${APP_ENV:-development}
      INSTANCE_ID: limiter-1
      TRUST_PROXY_HOPS: '1'
      IP_RATE_LIMIT: ${IP_RATE_LIMIT:-100}
      IP_RATE_WINDOW_MS: ${IP_RATE_WINDOW_MS:-60000}
      USER_RATE_LIMIT: ${USER_RATE_LIMIT:-20}
      USER_RATE_WINDOW_MS: ${USER_RATE_WINDOW_MS:-60000}
      SCOPED_RATE_LIMIT: ${SCOPED_RATE_LIMIT:-5}
      SCOPED_RATE_WINDOW_MS: ${SCOPED_RATE_WINDOW_MS:-60000}
      DEMO_API_KEYS: ${DEMO_API_KEYS:-}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  app2:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: '3000'
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_URL: redis://redis:6379
      REDIS_FAILURE_MODE: ${REDIS_FAILURE_MODE:-closed}
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-500}
      REDIS_COMMAND_TIMEOUT_MS: ${REDIS_COMMAND_TIMEOUT_MS:-250}
      REDIS_STARTUP_TIMEOUT_MS: ${REDIS_STARTUP_TIMEOUT_MS:-3000}
      APP_ENV: ${APP_ENV:-development}
      INSTANCE_ID: limiter-2
      TRUST_PROXY_HOPS: '1'
      IP_RATE_LIMIT: ${IP_RATE_LIMIT:-100}
      IP_RATE_WINDOW_MS: ${IP_RATE_WINDOW_MS:-60000}
      USER_RATE_LIMIT: ${USER_RATE_LIMIT:-20}
      USER_RATE_WINDOW_MS: ${USER_RATE_WINDOW_MS:-60000}
      SCOPED_RATE_LIMIT: ${SCOPED_RATE_LIMIT:-5}
      SCOPED_RATE_WINDOW_MS: ${SCOPED_RATE_WINDOW_MS:-60000}
      DEMO_API_KEYS: ${DEMO_API_KEYS:-}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  nginx:
    image: nginx:1.28-alpine
    ports:
      - '127.0.0.1:8080:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    networks:
      - backend
      - edge
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/health/live || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  backend:
    internal: true
  edge:
    driver: bridge

volumes:
  redis-data:
